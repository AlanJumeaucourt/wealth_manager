name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Backend — test
        run: cd backend && bun test

      - name: Backend API types (for Eden)
        run: cd backend && bun run build:types

      - name: Web — check (Vite+)
        run: cd web_application && vp check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="$VERSION-pr.$(git rev-parse --short HEAD)"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            VERSION="$VERSION-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: wealth-manager-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web_application/Dockerfile.prod
          push: false
          tags: wealth-manager-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VITE_API_URL=/api
