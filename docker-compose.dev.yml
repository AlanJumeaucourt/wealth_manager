name: wealth_manager_dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: rebuild
          path: backend/package.json
    volumes:
      - ./backend:/app
      # Keep container deps when the repo bind-mount hides image `node_modules` (avoids ENOENT on @elysiajs/* etc.)
      - backend_node_modules:/app/node_modules
      - backend_data:/app/data
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=5000
      - SQLITE_DB_PATH=/app/data/wealth.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
    ports:
      - "5000:5000"
    networks:
      - wealth-network
    env_file:
      - path: backend/.env
        required: false

  web_application:
    build:
      context: .
      dockerfile: web_application/Dockerfile.dev
    volumes:
      - ./web_application:/repo/web_application
      - web_application_node_modules:/repo/web_application/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://100.121.97.42:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - wealth-network

networks:
  wealth-network:
    driver: bridge

volumes:
  backend_data:
  backend_node_modules:
  web_application_node_modules:
