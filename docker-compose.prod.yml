name: wealth_manager_prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    volumes:
      - backend_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SQLITE_DB_PATH=/app/data/wealth.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "5001:5000"
    networks:
      - wealth-network
    env_file:
      - path: backend/.env
        required: false

  web_application:
    build:
      context: .
      dockerfile: web_application/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wealth-network

networks:
  wealth-network:
    driver: bridge

volumes:
  backend_data:
