services:
  - type: web
    name: wealth-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.prod
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      - key: SQLITE_DB_PATH
        value: /tmp/wealth.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_JSON
        value: "1"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SIMULATION_YEARS
        value: "10"

  - type: web
    env: static
    name: wealth-web-application
    rootDir: .
    buildCommand: >
      curl -fsSL https://bun.sh/install | bash &&
      export BUN_INSTALL="$HOME/.bun" &&
      export PATH="$BUN_INSTALL/bin:$PATH" &&
      bun install &&
      cd web_application &&
      bun run build
    staticPublishPath: ./web_application/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
